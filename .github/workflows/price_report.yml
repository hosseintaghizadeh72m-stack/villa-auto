name: price-report

on:
  schedule:
    - cron: "30 4 * * *"      # ۰۴:۳۰ UTC = ۰۸:۰۰ تهران
  workflow_dispatch:           # اجرای دستی

permissions:
  contents: write              # برای ذخیرهٔ price_history.json

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python price_post.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      - name: ذخیرهٔ قیمت‌های امروز
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if git diff --cached --quiet; then
            echo "تغییری برای ذخیره نیست"
          else
            git commit -m "price history"
            git pull --rebase
            git push
          fi
